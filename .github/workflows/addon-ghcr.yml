name: Publish add-on image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.tags.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          tags=("sha-${GITHUB_SHA::7}")
          if [[ "${GITHUB_REF_TYPE}" == "branch" ]]; then
            tags+=("${GITHUB_REF_NAME}")
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
            if ! grep -Rqx "version: ${version}" addon/*/config.yaml; then
              echo "No add-on config matches release version ${version}" >&2
              exit 1
            fi
            tags+=("${GITHUB_REF_NAME}" "${version}")
            if [[ "${version}" != *-* ]]; then
              tags+=("latest")
            fi
          fi
          printf -v tag_output '%s ' "${tags[@]}"
          echo "tags=${tag_output% }" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            build_from: ghcr.io/home-assistant/amd64-base-debian:bookworm
          - arch: aarch64
            platform: linux/arm64
            build_from: ghcr.io/home-assistant/aarch64-base-debian:bookworm

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.arch }} image
        shell: bash
        run: |
          image=$(printf '%s' "ghcr.io/${GITHUB_REPOSITORY_OWNER}/aqara-rocketmq-bridge-addon-${{ matrix.arch }}" | tr '[:upper:]' '[:lower:]')
          # shellcheck disable=SC2086
          for tag in ${{ needs.prepare.outputs.tags }}; do
            docker buildx build \
              --platform ${{ matrix.platform }} \
              --file addon/aqara-rocketmq-bridge/Dockerfile \
              --build-arg BUILD_FROM=${{ matrix.build_from }} \
              --tag "${image}:${tag}" \
              --push \
              .
          done
